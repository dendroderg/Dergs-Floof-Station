- type: entity
  name: borg laser sidearm
  parent: BaseWeaponBatterySmall
  suffix: Robot
  id: BorgWeaponMakeshiftLaser
  categories: [ HideSpawnMenu ]
  description: A servicable laser lens backed up by an intentionally underpowered configuration.
  components:
  - type: Sprite
    sprite: Objects/Weapons/Guns/Battery/makeshift.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-unshaded-4
      map: ["enum.GunVisualLayers.MagUnshaded"]
      shader: unshaded
  - type: Clothing
    sprite: Objects/Weapons/Guns/Battery/makeshift.rsi
  - type: HitscanBatteryAmmoProvider
    proto: RedLaser
    fireCost: 62.5
  - type: Battery
    maxCharge: 500
    startingCharge: 500
  - type: BatterySelfRecharger
    autoRecharge: true
    autoRechargeRate: 30
  - type: Gun
    minAngle: 2
    maxAngle: 10
    angleIncrease: 2
    angleDecay: 15 # Firing the 8 round magazine will recharge 2 rounds by the end of it. Mag dumping all "10" will cause wild shots.