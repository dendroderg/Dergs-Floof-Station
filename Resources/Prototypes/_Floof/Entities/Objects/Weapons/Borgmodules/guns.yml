- type: entity
  id: WeaponProtoKineticAcceleratorborg
  parent: WeaponProtoKineticAccelerator
  name: proto-kinetic accelerator borg
  categories: [ HideSpawnMenu ]
  components:
  - type: Gun
    fireRate: 0.5
    selectedMode: SemiAuto
    minAngle: 1
    maxAngle: 3
    availableModes:
    - SemiAuto
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/kinetic_accel.ogg
    fireOnDropChance: 1

- type: entity
  name: mk 58
  parent: BaseWeaponBatterySmall
  suffix: Robot, energy based
  id: WeaponborgPistolMk58
  categories: [ HideSpawnMenu ]
  description: A cheap, ubiquitous sidearm, produced by a NanoTrasen subsidiary. Uses .35 auto ammo.
  components:
  - type: Sprite
    sprite: Objects/Weapons/Guns/Pistols/mk58.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
  - type: Gun
    fireRate: 5
    availableModes:
    - SemiAuto
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/mk58.ogg
    fireOnDropChance: 0.5
  - type: ProjectileBatteryAmmoProvider
    proto: BulletPistol
    fireCost: 100
  - type: BatterySelfRecharger
    autoRecharge: true
    autoRechargeRate: 30
  - type: Battery
    maxCharge: 1000
    startingCharge: 1000

- type: entity
  parent: WeaponXrayCannon
  suffix: Robot
  id: BorgWeaponXrayCannon
  categories: [ HideSpawnMenu ]
  description: A weapon that is almost as infamous as its users.
  components:
  - type: BatterySelfRecharger
    autoRecharge: true
    autoRechargeRate: 30

- type: entity
  parent: WeaponPulseRifle
  suffix: Robot
  id: BorgWeaponPulseRifle
  categories: [ HideSpawnMenu ]
  description: A weapon that is almost as infamous as its users.
  components:
  - type: BatterySelfRecharger
