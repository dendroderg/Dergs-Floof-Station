- type: entity
  id: WeaponProtoKineticAcceleratorborg
  parent: WeaponProtoKineticAccelerator
  name: proto-kinetic accelerator borg
  categories: [ HideSpawnMenu ]
  components:
  - type: Gun
    fireRate: 0.5
    selectedMode: SemiAuto
    minAngle: 1
    maxAngle: 3
    availableModes:
    - SemiAuto
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/kinetic_accel.ogg
    fireOnDropChance: 1

- type: entity
  name: mk 58
  parent: BaseWeaponBatterySmall
  suffix: Robot, energy based
  id: WeaponborgPistolMk58
  categories: [ HideSpawnMenu ]
  description: A cheap, ubiquitous sidearm, produced by a NanoTrasen subsidiary. Uses .35 auto ammo.
  components:
  - type: Sprite
    sprite: Objects/Weapons/Guns/Pistols/mk58.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
  - type: Gun
    fireRate: 5
    availableModes:
    - SemiAuto
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/mk58.ogg
    fireOnDropChance: 0.5
  - type: ProjectileBatteryAmmoProvider
    proto: BulletPistol
    fireCost: 100
  - type: BatterySelfRecharger
    autoRecharge: true
    autoRechargeRate: 30
  - type: Battery
    maxCharge: 1000
    startingCharge: 1000

- type: entity
  name: x-ray cannon
  parent: BaseWeaponBattery #re-using from #1402
  suffix: Robot
  id: BorgWeaponXrayCannon
  categories: [ HideSpawnMenu ]
  description: An experimental weapon that uses concentrated x-ray energy against its target.
  components:
  - type: Sprite
    sprite: Objects/Weapons/Guns/Battery/xray.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-unshaded-0
      map: ["enum.GunVisualLayers.MagUnshaded"]
      shader: unshaded
  - type: Clothing
    sprite: Objects/Weapons/Guns/Battery/xray.rsi
  - type: Gun
    fireRate: 1.5
    minAngle: 1
    maxAngle: 20
    angleIncrease: 2
    angleDecay: 15 
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/laser3.ogg
  - type: HitscanBatteryAmmoProvider
    proto: XrayLaser
    fireCost: 100
  - type: MagazineVisuals
    magState: mag
    steps: 5
    zeroVisible: true
  - type: Appearance
  - type: BatterySelfRecharger
    autoRecharge: true
    autoRechargeRate: 30

- type: entity
  parent: WeaponPulseRifle
  suffix: Robot
  id: BorgWeaponPulseRifle
  categories: [ HideSpawnMenu ]
  description: A weapon that is almost as infamous as its users.
  components:
  - type: BatterySelfRecharger
    autoRecharge: true
    autoRechargeRate: 30

- type: entity
  name: borg laser sidearm
  parent: BaseWeaponBatterySmall
  suffix: Robot
  id: BorgWeaponMakeshiftLaser
  categories: [ HideSpawnMenu ]
  description: A servicable laser lens backed up by an intentionally underpowered configuration.
  components:
  - type: Sprite
    sprite: Objects/Weapons/Guns/Battery/makeshift.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-unshaded-4
      map: ["enum.GunVisualLayers.MagUnshaded"]
      shader: unshaded
  - type: Clothing
    sprite: Objects/Weapons/Guns/Battery/makeshift.rsi
  - type: ProjectileBatteryAmmoProvider
    proto: BulletBorgSidearmLaser
    fireCost: 62.5
  - type: Battery
    maxCharge: 500
    startingCharge: 500
  - type: BatterySelfRecharger
    autoRecharge: true
    autoRechargeRate: 30
  - type: Gun
    minAngle: 2
    maxAngle: 10
    angleIncrease: 2
    angleDecay: 15 # Firing the 8 round magazine will recharge 2 rounds by the end of it. Mag dumping all "10" will cause wild shots.

- type: entity
  name: focused laser sidearm #t1 energy module for Security Borgs
  parent: WeaponMakeshiftLaser
  suffix: Robot
  id: BorgWeaponMakeshiftHitscan
  categories: [ HideSpawnMenu ]
  description: A focused laser lens backed up by an intentionally underpowered configuration.
  components:
  - type: BatterySelfRecharger
    autoRecharge: true
    autoRechargeRate: 30
  - type: Gun
    minAngle: 2
    maxAngle: 10
    angleIncrease: 2
    angleDecay: 13 # Slightly better accuracy.

- type: entity
  name: laser longarm
  parent: WeaponLaserCarbine
  suffix: Robot
  id: BorgWeaponLaserLongarm
  categories: [ HideSpawnMenu ]
  description: A laser longarm equivalent that takes longer to recharge than sidearm configurations.
  components:
  - type: BatterySelfRecharger
    autoRecharge: true
    autoRechargeRate: 25 #takes 4 seconds to recharge one shot 
  - type: Gun
    minAngle: 2
    maxAngle: 10
    angleIncrease: 2
    angleDecay: 13